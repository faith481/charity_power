<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Assistance | Power For All</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">⚡ PowerForAll</div>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="apply.html" class="active btn-primary">Apply for Assistance</a>
    </div>
  </nav>

  <div class="form-wrapper">
    <div class="card shadow">
      <h2>Electricity Assistance Application</h2>
      <p class="subtitle">Enter your details below to register your meter for relief credit distribution.</p>

      <form id="assistanceForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="e.g. Mary Johnson" required>
        </div>

        <div class="form-group">
            <label for="Email">Email</label>
            <input type="email" id="email" placeholder="Enter your email address" required>
        </div>


        <div class="form-group">
          <label for="meterNumber">Electricity Meter Number</label>
          <input type="text" id="meterNumber" placeholder="e.g. 0123-4567-8901" required>
        </div>

        <div class="form-group">
          <label for="address">Residential Address</label>
          <textarea id="address" rows="3" placeholder="Enter street address, city, and state" required></textarea>
        </div>

        
        <button type="submit" id="submitBtn">Submit Application</button>
      </form>

      <div id="responseMessage" class="hidden"></div>
    </div>
  </div>

<script>
    const form = document.getElementById('assistanceForm');
    const responseMessage = document.getElementById('responseMessage');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = 'Submitting...';

        responseMessage.classList.add('hidden');
        responseMessage.textContent = '';

        const formData = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            address:document.getElementById('address').value,
            meterNumber: document.getElementById('meterNumber').value
        };

        try {
            const response = await fetch('/api/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            // Read the server response as text first
            const text = await response.text();

            let result;

            // Try to parse the response as JSON
            try {
                result = JSON.parse(text);
            } catch (parseError) {
                console.error('Server returned non-JSON:', text);

                responseMessage.textContent =
                    'Server error. Please try again later.';
                responseMessage.classList.remove('hidden');
                return;
            }

            if (response.ok) {
                responseMessage.className = 'status-success';
                responseMessage.textContent =
                    result.message || 'Application submitted successfully!';
                responseMessage.classList.remove('hidden');

                form.reset();
            } else {
                responseMessage.textContent =
                    result.error || 'An error occurred. Please try again.';
                responseMessage.classList.remove('hidden');
            }

        } catch (error) {
            console.error('Request error:', error);

            responseMessage.textContent =
                'Network error. Please try again later.';
            responseMessage.classList.remove('hidden');

        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Application';
        }
    });
</script>
<a href="index.html" class="back-link">Back to Dashboard</a>
</body>
</html>
